; WorkDiary — php-fpm-Pool im Container (MVP-720).
; Geladen als /usr/local/etc/php-fpm.d/zz-workdiary.conf, nach den Defaults
; des offiziellen Images (docker.conf: clear_env = no, Logs → stderr;
; zz-docker.conf: listen = 9000). Der Master läuft als www-data (USER im
; Dockerfile) — die user/group-Direktiven des Pools sind dann wirkungslos.

[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Länger laufende Exporte (PDF/XLSX, GoBD-Z3) — muss zu
; fastcgi_read_timeout (nginx) und max_execution_time (php.ini) passen.
request_terminate_timeout = 300s

pm.status_path = /fpm-status
ping.path = /fpm-ping
