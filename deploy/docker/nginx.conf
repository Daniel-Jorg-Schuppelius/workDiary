# WorkDiary — nginx-vhost für den Container-Betrieb (MVP-720, compose.yml
# Dienst „web"). TLS terminiert ein vorgelagerter Reverse-Proxy (Traefik,
# Caddy, nginx, Apache) — dieser vhost spricht nur HTTP nach innen.
#
# Wichtig für Request::ip()/Rate-Limits/Security-Log: Der vorgelagerte Proxy
# MUSS X-Forwarded-For/-Proto/-Host setzen (überschreiben, nicht anhängen), und
# die App braucht TRUSTED_PROXIES (docs/on-premise-docker.md, Abschnitt
# Reverse-Proxy). Die HTTP-Header werden von nginx unverändert als HTTP_*-
# FastCGI-Parameter durchgereicht; REMOTE_ADDR ist die Adresse des Proxys.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # UPLOAD_ATTACHMENT_KB (config/uploads.php, 25 MB) + Puffer; muss zu
    # upload_max_filesize/post_max_size in deploy/docker/php.ini passen.
    client_max_body_size 64m;
    client_body_timeout 120s;

    charset utf-8;
    server_tokens off;

    # Sicherheits-Header setzt die App selbst (SecurityHeaders-Middleware, CSP
    # mit Nonce) — hier nichts doppeln.

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite-Assets sind inhaltsgehasht → lange cachen.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Öffentliche Uploads (public/storage → storage/app/public, Volume ro)
    location /storage/ {
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Health-Route ohne Access-Log (Container-Healthchecks alle 30 s)
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Reverb-WebSocket (compose-Profil „reverb", BROADCAST_CONNECTION=reverb):
    # einkommentieren und den Proxy davor ebenfalls auf WebSocket-Upgrade stellen.
    # location /app/ {
    #     proxy_pass http://reverb:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 600s;
    # }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
