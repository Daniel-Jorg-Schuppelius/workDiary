; WorkDiary — PHP-Produktionswerte im Container (MVP-720).
; Geladen als /usr/local/etc/php/conf.d/zz-workdiary.ini (überschreibt Defaults).

; Upload-Grenzen: UPLOAD_ATTACHMENT_KB (config/uploads.php) = 25 MB; nginx
; client_max_body_size (deploy/docker/nginx.conf) passt dazu.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
max_input_vars = 5000

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Zeitzone der PHP-Laufzeit (Laravel rechnet in UTC, Anzeige über
; APP_DISPLAY_TIMEZONE); TZ-ENV des Containers wirkt auf date()-Fallbacks.
date.timezone = UTC

; OPcache: Image ist unveränderlich; Revalidierung alle 60 s hält manuelle
; config:cache-Läufe (docker compose exec …) trotzdem wirksam.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.jit = off

; Session-Cookie-Härtung übernimmt config/session.php (SESSION_*).
session.use_strict_mode = 1
