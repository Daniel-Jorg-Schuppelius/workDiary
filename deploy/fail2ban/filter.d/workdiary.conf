# WorkDiary fail2ban-Filter (Feature 096, MVP-444)
#
# Ziel-Log: storage/logs/security-YYYY-MM-DD.log (daily-Kanal `security`).
# Format-Vertrag (config/logging.php, per Test eingefroren):
#   [2026-07-21 14:32:11] security.WARNING: auth.failed ip=203.0.113.7 user="…"
#
# Test:
#   fail2ban-regex storage/logs/security-*.log deploy/fail2ban/filter.d/workdiary.conf

[Definition]
# Alle fail2ban-relevanten Ereignisklassen (Login, 2FA, Hinweisgeber-Postfach,
# API-/SCIM-Token, Webhook-Signaturen, SSO, Admin-IP-Sperre).
failregex = ^\[.*\] security\.(WARNING|NOTICE|INFO): (auth\.failed|auth\.lockout|auth\.2fa_failed|wb\.login_failed|api\.token_invalid|webhook\.signature_invalid|sso\.failed|admin\.ip_blocked) ip=<HOST>\b

ignoreregex =

[Init]
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
