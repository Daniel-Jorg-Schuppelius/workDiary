# WorkDiary fail2ban-Filter „streng" (Feature 096, MVP-444):
# nur die hochwertigen Brute-Force-Signale (2FA, Token, Signaturen) —
# für ein zweites Jail mit niedrigem maxretry und langer Bantime.

[Definition]
failregex = ^\[.*\] security\.(WARNING|NOTICE): (auth\.2fa_failed|api\.token_invalid|webhook\.signature_invalid|wb\.login_failed) ip=<HOST>\b

ignoreregex =

[Init]
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
