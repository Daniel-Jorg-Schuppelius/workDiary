name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pcntl, pdo_sqlite, sodium, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run static analysis
        run: composer lint

  security-gate:
    name: Security gate (dependencies & format)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pcntl, pdo_sqlite, sodium, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      # Feature 051, MVP-098: Secret-/Credential-History-Scan. Vollständige
      # Historie nachladen (Checkout ist flach) und gitleaks über alle Commits
      # laufen lassen — gefundene Geheimnisse sperren die Freigabe.
      - name: Secret history scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          git fetch --prune --unshallow 2>/dev/null || true
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      # Feature 051, MVP-098: Abhängigkeits-Advisories und Code-Stil als
      # reproduzierbares Gate. Die vollständige Testsuite läuft im tests-Job.
      - name: Composer dependency audit
        run: composer audit --no-interaction

      - name: NPM dependency audit (prod)
        run: npm audit --omit=dev

      - name: Generate SBOM (CycloneDX)
        run: composer sbom -- "${{ runner.temp }}/sbom.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error

      - name: Code style (pint)
        run: composer format

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout system dependency installer
        uses: actions/checkout@v6
        with:
          repository: DSchuppelius/install-dependencies
          ref: 8cfd278a89be3f58b734fac40779b5cb9d11a195
          path: .tools/install-dependencies
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pcntl, pdo_sqlite, sodium, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install system dependencies (PDF + common toolkit)
        env:
          CONFIG_DIR: ${{ github.workspace }}/vendor/daniel-jorg-schuppelius/php-pdf-toolkit/config
        # --all installiert auch optionale Tools (required=false), u. a. die
        # vom php-common-toolkit benötigten file/chardet/uchardet für die
        # Encoding-Erkennung bei CSV-/Datei-Imports. Die Vendor-Rekursion des
        # Skripts findet dafür vendor/dschuppelius/php-common-toolkit/config.
        run: bash .tools/install-dependencies/install-dependencies.sh --all

      - name: Prepare test environment
        run: |
          cp .env.testing .env
          touch /dev/shm/workdiary-testing.sqlite

      - name: Run tests
        run: composer test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
