; WorkDiary — OPcache für Testläufe auf der Kommandozeile.
; Eingebunden über PHP_INI_SCAN_DIR (scripts/run-tests.sh, CI-Testjobs,
; Nightly), nicht über phpunit.xml: opcache.enable_cli lässt sich nur beim
; Start von PHP setzen.
;
; Ohne OPcache kompiliert jeder Test beim App-Boot Routen, Konfiguration und
; Views neu, und ein Teil davon wird erst am Prozessende frei. Ein Worker
; wuchs so um rund 0,3 MB je Test, bis das memory_limit (1G aus
; phpunit.xml.dist) riss: Nightly seit 13.11.2026, Volllauf unter PHP 8.6.
; Mit OPcache bleibt der Speicher von Test zu Test gleich.
;
; revalidate_freq = 0 prüft den Zeitstempel bei jedem Einbinden: Tests, die
; PHP-Dateien schreiben und wieder einlesen, sehen immer den neuen Stand.
; Frisch geschriebene Dateien (jünger als file_update_protection, Vorgabe
; 2 s) legt OPcache ohnehin nicht ab.

opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 100000
